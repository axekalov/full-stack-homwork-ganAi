<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border-collapse: collapse;
            width: 100%;
        }
        th,td{
            padding: 12px 15px;
            text-align: right;
            border: 1px solid #cccccc;
        }
        .table-container{
            background-color: greenyellow;
         
            border-radius: 10px;
            box-shadow: 0 4px 15px;
            overflow: hidden;
            max-width: 800px;
            margin: 20px;
            
        }
    tr {
  transition: all 0.5s ease; /
}

tr:hover {
  background-color: aqua;
  cursor: pointer;
}
    </style>
</head>

<body>
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>רכישות</th>
                    <th>שם לקוח</th>
                    <th>ניקוד</th>
                    <th>סטטוס</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>10</td>
                    <td>דוד אקס</td>
                    <td>150</td>
                    <td>vip</td>
                </tr>
            </tbody>
            <tbody>
                <tr>
                    <td>4</td>
                    <td>ישראל ישר</td>
                    <td>50</td>
                    <td>כסף</td>
                </tr>
            </tbody>
            <tbody>
                <tr>
                    <td>3</td>
                    <td>דני דיין</td>
                    <td>20</td>
                    <td>כסף</td>
                </tr>
            </tbody>
            <tbody>
                <tr>
                    <td>0</td>
                    <td>יאיר גולן</td>
                    <td>0</td>
                    <td>חדש</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>

</html>
