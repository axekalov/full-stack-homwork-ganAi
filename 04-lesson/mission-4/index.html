<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .grid{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(2,80px);
            gap: 20px;
            padding: 20px;

        }
        .wi{
            background-color: greenyellow;
            border: 0.5px solid blue ;
            border-radius: 50px;
            padding: 10px;
            text-align: center;

        }
        .wi1{
            display: grid;
            place-items:center;
            background-color: aquamarine;
            font-weight: bold;
            text-align:center;
            border-radius: 50px;
            border: 0.5px solid yellow;
        }
    </style>
</head>
<body>
    <div class="grid">
        <div class="wi1">ראשון שונה  </div>
        <div class="wi">שני</div>
        <div class="wi">שלישי</div>
        <div class="wi">רביעי</div>
        <div class="wi">חמישי</div>
        <div class="wi">שישי</div>
    </div>
    
</body>
</html>
