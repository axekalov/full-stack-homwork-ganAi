<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            background-color: black;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-shadow: 0px 3px 5px;
            margin-right: 10px;
        }

        .imag {
            height: 5rem;
        }

        .item {
            display: inline-block;
            background-color: rgb(253, 204, 78);
            border-radius: 20px;
            margin: 5px;
            padding: 6px;
        }

        .item:hover {
            background-color: rgb(253, 204, 78, 0.5);
            transform: translateY(-2.5px);
        }
    </style>
</head>

<body>
    <nav class="container">
        <img class="imag" src="gio.png" alt="logo from gio">
        <div class="contanirA">
            <a class="item" href="">jackets</a>
            <a class="item" href="">pants</a>
            <a class="item" href="">shirts</a>
            <a class="item" href="">ties</a>
        </div>
    </nav>
</body>

</html>
